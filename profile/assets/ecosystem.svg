    <text x="40" y="90" textLength="120" lengthAdjust="spacing">MEASUREMENT</text>
    <text x="40" y="146" textLength="120" lengthAdjust="spacing">PROOF</text>
    <text x="40" y="202" textLength="120" lengthAdjust="spacing">CORE</text>
  </g>

