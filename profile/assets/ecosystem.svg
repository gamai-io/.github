    <text x="712" y="38" text-anchor="middle" fill="#BFDCF2" font-size="12" textLength="150" lengthAdjust="spacing">gama-lang</text>

    <rect x="180" y="74" width="200" height="30" rx="6" fill="url(#ebox)" stroke="#00A3FF" stroke-opacity="0.45"/>
    <text x="280" y="94" text-anchor="middle" fill="#BFDCF2" font-size="12" textLength="160" lengthAdjust="spacing">crossnode-bench</text>

    <rect x="396" y="74" width="200" height="30" rx="6" fill="url(#ebox)" stroke="#00A3FF" stroke-opacity="0.45"/>
    <text x="496" y="94" text-anchor="middle" fill="#BFDCF2" font-size="12" textLength="150" lengthAdjust="spacing">gamai-guard</text>

