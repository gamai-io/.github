<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" role="img" aria-labelledby="et ed" preserveAspectRatio="xMidYMid meet" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace">
  <title id="et">gamAI ecosystem</title>
  <desc id="ed">Slojevi: deterministicki core, izolacija, dokaz, mjerenje i vertikale.</desc>
  <defs>
    <linearGradient id="eplate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#03070e"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="ebox" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1727"/>
      <stop offset="1" stop-color="#050c16"/>
    </linearGradient>
    <linearGradient id="ebar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00A3FF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#0066CC" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="eglow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="900" height="240" fill="url(#eplate)"/>

  <g stroke="#00A3FF" stroke-opacity="0.16" stroke-width="1">
    <line x1="40" y1="52" x2="860" y2="52"/>
    <line x1="40" y1="108" x2="860" y2="108"/>
    <line x1="40" y1="164" x2="860" y2="164"/>
  </g>

  <g font-size="11" letter-spacing="1.5" fill="#5E7A94">
