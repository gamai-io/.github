    <text x="496" y="150" text-anchor="middle" fill="#D6E8F7" font-size="12" textLength="120" lengthAdjust="spacing">sigil</text>

    <rect x="612" y="130" width="200" height="30" rx="6" fill="url(#ebox)" stroke="#4FC3FF" stroke-opacity="0.6"/>
    <text x="712" y="150" text-anchor="middle" fill="#D6E8F7" font-size="12" textLength="170" lengthAdjust="spacing">evidence-first-runtime</text>

    <rect x="180" y="186" width="200" height="30" rx="6" fill="url(#ebox)" stroke="#00A3FF" stroke-opacity="0.8"/>
    <text x="280" y="206" text-anchor="middle" fill="#EAF6FF" font-size="12" textLength="120" lengthAdjust="spacing">dsc</text>

    <rect x="396" y="186" width="200" height="30" rx="6" fill="url(#ebox)" stroke="#00A3FF" stroke-opacity="0.8"/>
    <text x="496" y="206" text-anchor="middle" fill="#EAF6FF" font-size="12" textLength="170" lengthAdjust="spacing">gama-fastpath</text>

    <rect x="612" y="186" width="200" height="30" rx="6" fill="url(#ebox)" stroke="#00A3FF" stroke-opacity="0.8"/>
    <text x="712" y="206" text-anchor="middle" fill="#EAF6FF" font-size="12" textLength="150" lengthAdjust="spacing">gama-offline</text>
  </g>

  <rect x="180" y="228" width="632" height="3" rx="1.5" fill="url(#ebar)" filter="url(#eglow)"/>
