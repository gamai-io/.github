<svg xmlns="http://www.w3.org/2000/svg" width="900" height="24" viewBox="0 0 900 24" role="img" aria-label="divider" preserveAspectRatio="none">
  <defs>
    <linearGradient id="dline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00A3FF" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#00A3FF" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#4FC3FF" stop-opacity="0.95"/>
      <stop offset="0.82" stop-color="#00A3FF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#00A3FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="dglow" x="-10%" y="-200%" width="120%" height="500%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="900" height="24" fill="#000000"/>
  <line x1="0" y1="12" x2="900" y2="12" stroke="url(#dline)" stroke-width="1.4" filter="url(#dglow)"/>
  <circle cx="450" cy="12" r="2.4" fill="#4FC3FF">
    <animate attributeName="opacity" values="1;0.2;1" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="450" cy="12" r="7" fill="none" stroke="#00A3FF" stroke-opacity="0.35" stroke-width="1">
    <animate attributeName="r" values="4;11;4" dur="3.4s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.45;0;0.45" dur="3.4s" repeatCount="indefinite"/>
  </circle>
</svg>
